spring.application.name=safari-lanka
server.port=${SERVER_PORT:8080}

# MySQL Workbench / local development defaults requested for this project.
# Environment variables may override these values when deploying later.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/safari_lanka?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=Asia/Colombo

app.jwt.secret=${JWT_SECRET:SafariLankaSE2030AcademicPrototypeJwtSecretKey2026MustBeLongEnoughForHS256}
app.jwt.expiration-ms=86400000
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Uploaded bank slips/package images plus local package preview videos.
app.upload.dir=${UPLOAD_DIR:uploads}
app.frontend.public.dir=${FRONTEND_PUBLIC_DIR:../frontend/public}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
